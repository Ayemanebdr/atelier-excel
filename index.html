<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atelier Excel & Power BI</title>
<meta name="theme-color" content="#0b5d3b">
<meta name="description" content="Cours et cas pratiques Excel & Power BI pour le contrôle de gestion">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: a modern learning app for a future financial controller — focused, calm, encouraging.
   IDEA: a spreadsheet you progress through: the selected yellow cell marks where you are.
   PICTURE: a progress ring and the 16-cell session row on the home screen.
   COLOUR and TYPE: spreadsheet green leads, mint surfaces, yellow selected-cell accent; Manrope + JetBrains Mono for formulas.
   LAYOUT: app shell — sidebar on desktop, bottom tab bar on phone; cards, segmented controls, accordions. */
:root{color-scheme:light dark;
--bg:light-dark(#f5f7f6,#0b100d);--card:light-dark(#ffffff,#141b17);--ink:light-dark(#10201a,#e8efea);--mute:light-dark(#5e6f66,#93a89c);
--line:light-dark(#e3e9e5,#223029);--soft:light-dark(#eef4f0,#18231d);--g:#0b5d3b;--g2:light-dark(#0b5d3b,#47b77a);--gl:light-dark(#e3f2e9,#16301f);
--y:#ffd43b;--yl:light-dark(#fff5cc,#3a3214);--r:light-dark(#b93a12,#ff8c63);--rl:light-dark(#fdece5,#3a1c11);
--sh:0 1px 2px rgba(16,32,26,.06),0 8px 24px rgba(16,32,26,.06);--rad:18px;
--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Manrope,system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
code,kbd,pre{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.88em}
code{overflow-wrap:anywhere;background:var(--soft);padding:1px 6px;border-radius:6px}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:0 6px;background:var(--card)}
button{font:inherit;cursor:pointer;color:inherit}
a{color:var(--g2)}
:focus-visible{outline:3px solid var(--y);outline-offset:2px;border-radius:8px}
h1,h2,h3,h4{letter-spacing:-.02em;line-height:1.15;margin:0}
h1{font-size:clamp(28px,4vw,42px);font-weight:800;text-wrap:balance}
h2{font-size:clamp(21px,2.4vw,26px);font-weight:800}
h3{font-size:18px;font-weight:700}
h4{font-size:16px;font-weight:700;margin:22px 0 8px}
p{margin:0 0 12px}
.mute{color:var(--mute)}.small{font-size:14px}
/* shell */
.shell{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100vh}
aside.side{position:sticky;top:0;height:100vh;padding:22px 16px;border-right:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;padding:4px 8px 18px}
.brand .lg{width:34px;height:34px;border-radius:10px;background:var(--g);display:grid;place-items:center;color:#fff;font:italic 700 15px "JetBrains Mono",monospace;box-shadow:inset 0 0 0 2px var(--y)}
.brand small{display:block;font-weight:500;color:var(--mute);font-size:12px}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;text-decoration:none;color:var(--ink);font-weight:600;min-height:44px}
.nav a svg{width:20px;height:20px;flex:none}
.nav a.on{background:var(--gl);color:var(--g2)}
.nav a:hover:not(.on){background:var(--soft)}
.syncbox{margin-top:auto;background:var(--soft);border-radius:14px;padding:12px;font-size:13px}
.dot{display:inline-block;width:8px;height:8px;border-radius:9px;background:var(--mute);margin-right:6px}
.dot.ok{background:#22a55a}.dot.warn{background:#e0a000}
main{padding:28px clamp(16px,3.5vw,44px) 60px;max-width:1120px;width:100%}
.topbar{display:none}
.tabbar{display:none}
@media(max-width:899px){
  .shell{grid-template-columns:minmax(0,1fr)}
  aside.side{display:none}
  .topbar{display:flex;position:sticky;top:0;z-index:20;align-items:center;gap:10px;padding:calc(10px + var(--safe-t)) 16px 10px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .topbar .brand{padding:0;flex:1}
  main{padding:16px 16px calc(96px + var(--safe-b))}
  .tabbar{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 6px calc(6px + var(--safe-b))}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:700;text-decoration:none;color:var(--mute);padding:6px 0;border-radius:12px;min-height:52px;justify-content:center}
  .tabbar a svg{width:22px;height:22px}
  .tabbar a.on{color:var(--g2)}
  .tabbar a.on svg{background:var(--gl);border-radius:10px;padding:2px 10px;width:42px;height:26px;box-sizing:content-box;margin:-2px 0}
}
/* cards */
.card{background:var(--card);border-radius:var(--rad);box-shadow:var(--sh);padding:clamp(16px,2.4vw,24px)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
@media(max-width:899px){.g2{grid-template-columns:minmax(0,1fr)}}
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.hero{background:var(--g);color:#fff;border-radius:22px;padding:clamp(20px,3vw,30px);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:220px;height:220px;background:repeating-linear-gradient(0deg,rgba(255,255,255,.07) 0 1px,transparent 1px 28px),repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 1px,transparent 1px 44px);border-radius:30px;transform:rotate(8deg)}
.hero .lab{font-size:13px;font-weight:700;opacity:.85;margin-bottom:8px;position:relative}
.hero h1{color:#fff;margin-bottom:10px;position:relative;font-size:clamp(26px,3.6vw,38px)}
.hero p{opacity:.9;position:relative;max-width:52ch}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 18px;position:relative}
.pill{font-size:13px;font-weight:700;border-radius:99px;padding:5px 11px;background:rgba(255,255,255,.14)}
.pill.done{background:var(--y);color:#1c1a0c}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 18px;min-height:48px;font-weight:800;text-decoration:none;position:relative}
.btn.y{background:var(--y);color:#1c1a0c}.btn.g{background:var(--g);color:#fff}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.full{width:100%}
.ringwrap{display:flex;align-items:center;gap:18px}
.ring{width:112px;height:112px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:24px;font-weight:800}
.ring b small{display:block;font-size:11px;color:var(--mute);font-weight:600;margin-top:-6px}
.week{display:flex;gap:8px;margin-top:10px}
.week span{flex:1;border-radius:12px;border:1.5px dashed var(--line);padding:8px 10px;font-size:13px;font-weight:700;color:var(--mute)}
.week span.ok{border:0;background:var(--gl);color:var(--g2)}
.strip{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:4px;margin-top:16px}
.strip i{aspect-ratio:1;border-radius:6px;background:var(--soft);display:grid;place-items:center;font:600 10px "JetBrains Mono",monospace;font-style:normal;color:var(--mute)}
.strip i.ready{background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink)}
.strip i.cur{background:var(--yl);box-shadow:inset 0 0 0 2px var(--y);color:var(--ink)}
.strip i.done{background:var(--g);color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px}
.stat{background:var(--soft);border-radius:14px;padding:12px}
.stat b{display:block;font-size:22px;font-weight:800;line-height:1.2}
.stat span{font-size:12.5px;color:var(--mute);font-weight:600}
.sec{margin:30px 0 12px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.phase{font-size:13px;font-weight:800;color:var(--mute);margin:18px 0 8px}
.list{display:grid;gap:8px}
.item{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--sh);text-decoration:none;color:inherit}
.item .num{width:44px;height:44px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font:600 13px "JetBrains Mono",monospace}
.item.fait .num{background:var(--g);color:#fff}.item.cours .num{background:var(--yl);box-shadow:inset 0 0 0 2px var(--y)}
.item.venir{box-shadow:none;background:transparent;border:1.5px dashed var(--line)}
.item.venir .t{color:var(--mute)}
.item .t{font-weight:700;line-height:1.3}
.item .d{font-size:13px;color:var(--mute);line-height:1.4;margin-top:2px}
.tag{font-size:12px;font-weight:800;border-radius:99px;padding:4px 10px;white-space:nowrap}
.tag.fait{background:var(--g);color:#fff}.tag.cours{background:var(--yl)}.tag.faire{background:var(--gl);color:var(--g2)}.tag.venir{color:var(--mute)}
/* séance */
.back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--mute);font-weight:700;font-size:14px;margin-bottom:10px;min-height:36px}
.shead{margin-bottom:14px}
.shead .lab{font-size:13px;font-weight:800;color:var(--g2);margin-bottom:6px}
.seg{position:sticky;top:0;z-index:10;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:var(--soft);padding:4px;border-radius:14px;margin:16px 0 18px}
@media(max-width:899px){.seg{top:calc(57px + var(--safe-t))}}
.seg button{border:0;background:transparent;border-radius:11px;padding:9px 4px;font-weight:700;font-size:14px;color:var(--mute);min-height:44px;line-height:1.2}
.seg button small{display:block;font-size:11px;font-weight:600}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.objd summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--mute);margin-top:10px;min-height:32px}
.lg-only{}@media(max-width:600px){.lg-only{display:none}}
.objs{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.objs span{font-size:13px;font-weight:600;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 11px}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--g2);border-radius:9px;transition:width .4s}
.acc{background:var(--card);border-radius:18px;box-shadow:var(--sh);margin-bottom:10px;overflow:hidden}
.acc>button{width:100%;display:grid;grid-template-columns:32px minmax(0,1fr) auto 20px;gap:12px;align-items:center;text-align:left;border:0;background:none;padding:16px;min-height:64px}
.acc .ck{width:32px;height:32px;border-radius:10px;background:var(--soft);display:grid;place-items:center;font-weight:800;font-size:13px}
.acc.ok .ck{background:var(--g);color:#fff}
.acc .ti{font-weight:700;line-height:1.3}
.acc .du{font-size:12.5px;color:var(--mute);font-weight:700;white-space:nowrap}
.acc .ch{transition:transform .2s;color:var(--mute)}
.acc.open .ch{transform:rotate(180deg)}
.acc .body{padding:0 18px 20px;display:none;max-width:80ch}
.acc.open .body{display:block}
pre.formula{background:var(--soft);border-left:4px solid var(--g2);padding:12px 14px;border-radius:10px;overflow-x:auto;white-space:pre;margin:12px 0}
pre.formula code{background:none;padding:0}
.tip,.trap{border-radius:14px;padding:12px 14px;margin:14px 0;font-size:15px}
.tip{background:var(--yl)}.trap{background:var(--rl)}
.tip b,.trap b{display:block;margin-bottom:2px}.trap b{color:var(--r)}
figure.xl{margin:14px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
figure.xl figcaption{font-size:13px;color:var(--mute);padding:8px 12px;border-bottom:1px solid var(--line);font-weight:600}
.fx{display:flex;border-bottom:1px solid var(--line);font-size:13.5px;background:var(--soft)}
.fx .nm{padding:7px 10px;border-right:1px solid var(--line);color:var(--mute);font-family:"JetBrains Mono",monospace;min-width:52px}
.fx code{background:none;padding:7px 10px}
.scroll{overflow-x:auto}
figure.xl table{border-collapse:collapse;font-size:13.5px;width:100%}
figure.xl th{background:var(--soft);color:var(--mute);font-weight:600;font-size:11.5px;padding:3px 8px;border:1px solid var(--line)}
figure.xl td{border:1px solid var(--line);padding:6px 9px;white-space:nowrap}
figure.xl td.num{text-align:right;font-variant-numeric:tabular-nums}
figure.xl td.hi{background:var(--yl);box-shadow:inset 0 0 0 2px var(--y);font-weight:700}
figure.xl td.src{background:var(--gl)}
table.plain{border-collapse:collapse;width:100%;font-size:14.5px;margin:12px 0}
table.plain th,table.plain td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
table.plain th{font-size:12.5px;color:var(--mute)}
table.num td:not(:first-child),table.num th:not(:first-child){text-align:right;white-space:nowrap}
tr.bad td{color:var(--r);font-weight:700}
.donebtn{margin-top:16px}
/* quiz */
.quiz{background:var(--card);border-radius:20px;box-shadow:var(--sh);padding:clamp(18px,3vw,26px);margin-top:18px}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.qdots{display:flex;gap:5px}.qdots i{width:22px;height:6px;border-radius:9px;background:var(--line)}.qdots i.r{background:#22a55a}.qdots i.w{background:var(--r)}.qdots i.c{background:var(--y)}
.qq{font-size:18px;font-weight:800;margin:6px 0 14px;line-height:1.35}
.opts{display:grid;gap:8px}
.opts button{text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;min-height:50px;font-weight:600}
.opts button.right{border-color:#22a55a;background:var(--gl)}.opts button.wrong{border-color:var(--r);background:var(--rl)}
.ex{margin-top:12px;font-size:15px;background:var(--soft);border-radius:12px;padding:10px 12px}
.qnav{display:flex;justify-content:space-between;gap:8px;margin-top:14px}
/* cas */
blockquote{margin:12px 0;padding:14px 16px;border-left:4px solid var(--y);background:var(--yl);border-radius:0 14px 14px 0;font-style:italic}
.steps{display:grid;gap:8px;margin:12px 0}
.step{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--card);border-radius:16px;padding:12px;box-shadow:var(--sh)}
.step button{width:48px;height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font:700 15px "JetBrains Mono",monospace}
.step.ok button{background:var(--g);border-color:var(--g);color:#fff}
.step.ok b{text-decoration:line-through;opacity:.55}
.step small{display:block;color:var(--mute);font-size:13.5px;line-height:1.4}
.step .mn{font-size:12.5px;color:var(--mute);font-weight:700;white-space:nowrap}
.lock{text-align:center;padding:40px 20px}
.lock .ic{width:56px;height:56px;border-radius:16px;background:var(--yl);display:grid;place-items:center;margin:0 auto 12px}
.lead{font-size:18px;font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0}
.kpis div{background:var(--soft);border-radius:14px;padding:12px}.kpis span{font-size:12.5px;color:var(--mute);display:block;font-weight:600}.kpis b{font-size:22px;font-weight:800}
table.f td:first-child{white-space:nowrap;color:var(--mute);width:1%}
.note{color:var(--mute);font-size:14.5px}
/* bilan */
label.l{font-weight:700;display:block;margin:14px 0 6px}
textarea,input[type=search]{width:100%;font:16px/1.5 Manrope,sans-serif;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--card);color:var(--ink)}
textarea{min-height:88px;resize:vertical}
.ev{padding:12px 0;border-bottom:1px solid var(--line)}
.ev p{font-weight:600;font-size:15px;margin-bottom:8px}
.sc{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.sc button{height:44px;border:1.5px solid var(--line);background:var(--card);border-radius:12px;font-weight:800}
.sc button.on{background:var(--g);border-color:var(--g);color:#fff}
.saved{font-size:13px;color:var(--mute);min-height:20px;margin-top:6px}
/* mémo */
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.chips button{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:7px 13px;font-weight:700;font-size:13.5px;white-space:nowrap;min-height:38px}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.memo{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.mc{background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:14px}
.mc .th{font-size:12px;font-weight:800;color:var(--g2)}
.mc code{display:block;margin:6px 0;background:var(--soft);padding:8px 10px;border-radius:10px;font-size:13px}
.mc p{font-size:14px;color:var(--mute);margin:0}
/* profil */
.row2{display:flex;gap:10px;flex-wrap:wrap}
.empty{color:var(--mute);padding:20px 0}
@media(prefers-reduced-motion:no-preference){.view{animation:in .25s ease-out}@keyframes in{from{opacity:0;transform:translateY(6px)}}}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><span class="lg">fx</span><span>Atelier Excel & Power BI<small>Cas Rhôna Distribution</small></span></div>
    <nav class="nav" id="sidenav"></nav>
    <div class="syncbox" id="syncbox"></div>
  </aside>
  <div>
    <header class="topbar"><div class="brand"><span class="lg">fx</span><span>Atelier<small>Excel & Power BI</small></span></div><span class="small mute" id="topsync"></span></header>
    <main id="app"></main>
  </div>
</div>
<nav class="tabbar" id="tabbar" aria-label="Navigation"></nav>
<script src="content.js"></script>
<script src="firebase-config.js" onerror="window.FIREBASE_CONFIG=null"></script>
<script>
{
const app = document.getElementById('app');
const pad = n => String(n).padStart(2, '0');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const EMPTY = () => ({notions:{}, quiz:{}, steps:{}, journal:{}, evals:{}, done:{}, corrige:{}, updatedAt:0});
const LS = 'atelier-rhona-v1';
const IN_CLAUDE = !!(window.claude && typeof window.claude.use === 'function');
let S = EMPTY(), ui = {tab:{}, open:{}, q:{}, memo:'Tout'}, remote = null, sync = {mode:'local', user:null, msg:''}, saveT = null;
try { const l = localStorage.getItem(LS); if (l) S = Object.assign(EMPTY(), JSON.parse(l)); } catch (e) {}

const ICON = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>',
  book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h11a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3z"/><path d="M4 17a3 3 0 0 1 3-3h11"/></svg>',
  memo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18M9 3v18"/></svg>',
  user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',

    if (remote) { try { await remote.save(JSON.parse(JSON.stringify(S))); setSaved('Synchronisé'); } catch (e) { setSaved('Enregistré sur cet appareil'); } }

}
function setSaved(t) { document.querySelectorAll('.saved').forEach(e => e.textContent = t); }
function adopt(d) {
  if (!d || (d.updatedAt || 0) <= (S.updatedAt || 0)) return false;
  S = Object.assign(EMPTY(), d); try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {}

}

  const qn = e.target.closest('[data-qn]'); if (qn) { ui.q[k] = Math.max(0, (ui.q[k] || 0) + (+qn.dataset.qn)); render(true); return; }
  const sb = e.target.closest('[data-step]'); if (sb) { S.steps[k] = Object.assign({}, S.steps[k]); S.steps[k][sb.dataset.step] = !S.steps[k][sb.dataset.step]; persist(); render(true); return; }
  const eb = e.target.closest('[data-ev]'); if (eb) { S.evals[k] = (S.evals[k] || []).slice(); S.evals[k][+eb.dataset.ev] = +eb.dataset.v; persist(); render(true); return; }
  const th = e.target.closest('[data-th]'); if (th) { ui.memo = th.dataset.th; document.querySelectorAll('[data-th]').forEach(b => b.classList.toggle('on', b === th)); drawMemo(); return; }
  const id = e.target.closest('button') && e.target.closest('button').id;
  if (id === 'openCorr') { S.corrige = Object.assign({}, S.corrige, {[k]: true}); persist(); render(true); }
  if (id === 'finish') { S.done = Object.assign({}, S.done, {[k]: new Date().toISOString()}); persist(); location.hash = '#accueil'; }
  if (id === 'undo') { S.done = Object.assign({}, S.done); delete S.done[k]; persist(); render(true); }
  if (id === 'copyLink') { const b = e.target.closest('button'); try { await navigator.clipboard.writeText(b.dataset.link); document.getElementById('cpmsg').textContent = 'Lien copié. Envoie-le-toi (WhatsApp, mail) et ouvre-le sur ton téléphone.'; } catch (x) { document.getElementById('cpmsg').textContent = 'Sélectionne le lien ci-dessus et copie-le.'; } }
  if (id === 'useKey') { const v = (document.getElementById('newKey').value || '').trim(); if (v.length >= 32) { try { localStorage.setItem('atelier-cle', v); } catch (x) {} location.reload(); } }
  if (id === 'login' && remote && remote.login) { try { await remote.login(); } catch (err) { sync.msg = 'Connexion impossible : ' + (err && err.code || 'réessaie'); render(true); } }
  if (id === 'logout' && remote && remote.logout) remote.logout();
  if (id === 'exp') { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(S)], {type:'application/json'})); a.download = 'atelier-progression-' + new Date().toISOString().slice(0,10) + '.json'; a.click(); document.getElementById('bk').textContent = 'Sauvegarde téléchargée.'; }
  if (id === 'dl') {
    const msg = document.getElementById('dlmsg');
    try {
      const b64 = (await (await fetch(c.file + '.b64.txt')).text()).trim(), bin = atob(b64), u8 = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
      const d = await claude.use('downloads'); await d.save({filename: 'Rhona_S' + pad(cu.n) + '.xlsx', data: new Blob([u8])}); msg.textContent = 'Classeur téléchargé.';
    } catch (err) { msg.textContent = err && err.code === 'declined' ? 'Téléchargement annulé.' : 'Téléchargement impossible ici.'; }
  }
});
document.addEventListener('change', e => {
  if (e.target.id !== 'imp' || !e.target.files[0]) return;
  const r = new FileReader();
  r.onload = () => { try { const d = JSON.parse(r.result); if (!d || !d.done) throw 0; S = Object.assign(EMPTY(), d); persist(); render(true); document.getElementById('bk').textContent = 'Progression restaurée.'; } catch (x) { document.getElementById('bk').textContent = "Ce fichier n'est pas une sauvegarde valide."; } };
  r.readAsText(e.target.files[0]);
});
let jt = null;
document.addEventListener('input', e => { const t = e.target.closest('[data-j]'); if (!t) return; const k = curK().k; S.journal[k] = Object.assign({}, S.journal[k], {[t.dataset.j]: t.value}); clearTimeout(jt); jt = setTimeout(persist, 600); });
window.addEventListener('hashchange', () => { render(); scrollTo(0, 0); });
render();

/* ---------- connexion au stockage en ligne ---------- */
async function connectClaude() {
  const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
  if (!db || !user) return; const uid = await user.id(); if (!uid) return;
  const ref = db.doc('data/users/' + uid + '/progress');
  remote = {save: d => ref.set(d)}; sync.mode = 'claude';
  const snap = await ref.get();
  if (snap.exists) { if (!adopt(JSON.parse(JSON.stringify(snap.data()))) && S.updatedAt > ((snap.data() || {}).updatedAt || 0)) await ref.set(JSON.parse(JSON.stringify(S))); }
  else if (S.updatedAt) await ref.set(JSON.parse(JSON.stringify(S)));
  paintSync();
}
/* Synchro sans compte : une clé secrète par personne, partagée entre ses appareils par un lien. */
function syncKey() {
  let k = null;
  try { const u = new URL(location.href); k = u.searchParams.get('cle'); if (k) { localStorage.setItem('atelier-cle', k); u.searchParams.delete('cle'); history.replaceState(null, '', u.pathname + u.hash); } } catch (e) {}
  try { k = k || localStorage.getItem('atelier-cle'); } catch (e) {}
  if (!k || k.length < 32) { const a = new Uint8Array(24); crypto.getRandomValues(a); k = Array.from(a, b => 'abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'[b % 56]).join('') + Array.from(crypto.getRandomValues(new Uint8Array(8)), b => '23456789abcdefgh'[b % 16]).join(''); try { localStorage.setItem('atelier-cle', k); } catch (e) {} }
  return k;
}
async function connectFirebase(cfg) {
  const V = 'https://www.gstatic.com/firebasejs/10.12.2/';
  const [{initializeApp}, F] = await Promise.all([import(V + 'firebase-app.js'), import(V + 'firebase-firestore.js')]);
  const fs = F.getFirestore(initializeApp(cfg));
  const key = syncKey(), ref = F.doc(fs, 'users', 'atelier_' + key);
  sync.mode = 'firebase'; sync.key = key; sync.user = 'clé ' + key.slice(0, 4) + '…';
  const pick = d => { const o = {}; ['notions','quiz','steps','journal','evals','done','corrige','updatedAt'].forEach(x => { if (d[x] !== undefined) o[x] = d[x]; }); return JSON.parse(JSON.stringify(o)); };
  remote = {save: d => F.setDoc(ref, pick(d))};
  try {
    const snap = await F.getDoc(ref);
    if (snap.exists()) { if (!adopt(snap.data()) && S.updatedAt > (snap.data().updatedAt || 0)) await F.setDoc(ref, pick(S)); }
    else await F.setDoc(ref, pick(S));
    F.onSnapshot(ref, s => { if (s.exists() && !s.metadata.hasPendingWrites) adopt(s.data()); });
  } catch (e) { sync.user = null; sync.msg = 'Synchronisation indisponible pour le moment.'; }
  render(true);
}
(async () => {
  try {
    if (IN_CLAUDE) await connectClaude();
    else {
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
      const cfg = window.FIREBASE_CONFIG; if (cfg && cfg.apiKey) await connectFirebase(cfg);
    }
  } catch (e) { paintSync(); }
})();
}
